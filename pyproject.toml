[tool.black]
line-length = 88
extend-exclude = "auditoria"

[tool.ruff]
line-length = 88
extend-exclude = ["auditoria"]

[tool.ruff.lint]
select = ["E", "F", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["hospital"]

[tool.coverage.report]
show_missing = true
fail_under = 80
